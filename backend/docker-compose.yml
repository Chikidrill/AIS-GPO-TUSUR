services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ais_gpo
      POSTGRES_USER: ais_gpo
      POSTGRES_PASSWORD: ais_gpo
    ports:
      - "5432:5432"
    volumes:
      - ais_gpo_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ais_gpo -d ais_gpo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ais_gpo_pgdata:
