services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ais_gpo
      POSTGRES_USER: ais_gpo
      POSTGRES_PASSWORD: ais_gpo
    volumes:
      - ais_gpo_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ais_gpo -d ais_gpo"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=ais_gpo;Username=ais_gpo;Password=ais_gpo
    ports:
      - "5080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  ais_gpo_pgdata:
    external: true
    name: backend_ais_gpo_pgdata